name: Vue.js Dev Workflow

on:
  push:
    branches:
      - dev          
  pull_request:
    branches:
      - dev         

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  
          cache: 'npm'      

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

